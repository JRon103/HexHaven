<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hexhaven</title>
  <meta name="description" content="Build, trade and settle a hex island with 2–8 friends.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#173f4d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/style.css">
  <!-- the player's chosen theme, applied before anything is drawn (no flash) -->
  <script>try { var t = localStorage.getItem("hexhaven:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/crowns-ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
