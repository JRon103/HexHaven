# Every push to main: run the bot self-play tests, then redeploy to Cloud Run.
# Login is keyless (Workload Identity Federation): Google only trusts this repository's workflows.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Bot self-play tests
        run: node test/sim.js 30 6 && node test/sim.js 15 8 && node test/sim.js 15 2 && node test/save-test.js 20 && node test/crowns-sim.js 30 && node test/crowns-save-test.js 12

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/401668287786/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@hexhaven-julian-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      # Same settings as the first deploy. --max-instances 1 is required: all game state lives in one server.
      # APP_COMMIT / APP_BUILT tell the running server which code it is (shown at /api/version and in the UI).
      - name: Deploy
        run: >
          gcloud run deploy hexhaven --source . --project hexhaven-julian-2026 --region us-central1
          --max-instances 1 --concurrency 1000 --timeout 3600 --quiet
          --update-env-vars "APP_COMMIT=${{ github.sha }},APP_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Show the live build
        run: curl -s https://hexhaven-401668287786.us-central1.run.app/api/version
